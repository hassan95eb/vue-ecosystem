pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,vue,js}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: '*.{ts,tsx,vue,js,json,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm turbo run typecheck
