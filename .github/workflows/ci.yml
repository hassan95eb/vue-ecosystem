name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo Remote Cache.
  #
  # GitHub does NOT expose repository secrets to workflow runs from forked PRs, so on
  # an external contributor's first PR these are simply empty. Turbo then falls back to
  # the local cache and the run still succeeds -- a missing token must never be a hard
  # failure, or every outside contribution goes red for no reason.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Report remote cache status
        run: |
          if [ -n "$TURBO_TOKEN" ]; then
            echo "Turborepo remote cache: enabled"
          else
            echo "Turborepo remote cache: disabled (no TURBO_TOKEN -- expected on forked PRs)"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: Check for a changeset
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
        continue-on-error: true
